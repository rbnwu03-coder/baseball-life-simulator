<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game-State Integrity Browser Validation</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    body { margin: 0; padding: 24px; background: #f4f0e6; }
    .fixture-toolbar, #fixtureRoot { max-width: 1180px; margin: 0 auto 16px; }
    .fixture-toolbar { padding: 18px; border-radius: 16px; background: #fff; box-shadow: 0 8px 30px #1d2d2530; }
    .fixture-toolbar h1 { margin: 0 0 8px; font-size: 1.3rem; }
    .fixture-toolbar p { margin: 0 0 12px; color: #536157; }
    .fixture-buttons { display: flex; flex-wrap: wrap; gap: 8px; }
    .fixture-buttons button { width: auto; margin: 0; padding: 9px 13px; border: 1px solid #8b9a90; border-radius: 999px; background: #fff; color: #243a30; }
    .fixture-meta { max-width: 1180px; margin: 0 auto 14px; padding: 10px 14px; border-left: 4px solid #9c5b32; background: #fff8ea; }
    .fixture-meta span { display: inline-block; margin-right: 12px; }
  </style>
</head>
<body>
  <header class="fixture-toolbar">
    <h1>Baseball Match Foundation 2.2.1｜Game-State Integrity</h1>
    <p>所有情境都使用正式 match state、內野 resolver、presentation cursor 與 commentary formatter。</p>
    <div class="fixture-buttons" role="group" aria-label="2.2.1 瀏覽器驗收控制">
      <button type="button" onclick="showThirdOutFixture()">A／B｜第三出局與換邊</button>
      <button type="button" onclick="showEmptyBaseDecisionFixture()">C｜空壘一壘手</button>
      <button type="button" onclick="showEmptyBaseErrorFixture()">D｜空壘失誤</button>
      <button type="button" onclick="showSingleCommentaryFixture()">E｜一壘安打</button>
      <button type="button" onclick="showDoubleScoreFixture()">F｜二壘安打得分</button>
      <button type="button" onclick="showMultiInningFixture()">G｜跑完前三局</button>
    </div>
  </header>
  <p class="fixture-meta" id="fixtureMeta" aria-live="polite"></p>
  <main id="fixtureRoot"></main>
  <div id="story" hidden></div><div id="choices" hidden></div><div id="changeLog" hidden></div><div id="status" hidden></div><div id="time" hidden></div><div id="player-info" hidden></div>

  <script>
    window.fixtureErrors = [];
    window.addEventListener("error", event => window.fixtureErrors.push(event.message || "error"));
    window.addEventListener("unhandledrejection", event => window.fixtureErrors.push(String(event.reason || "rejection")));
  </script>
  <script src="../player.js"></script><script src="../current-state-boundary.js"></script><script src="../time-boundary.js"></script>
  <script src="../relationship-boundary.js"></script><script src="../evaluation-registry.js"></script><script src="../coach-evaluation-boundary.js"></script>
  <script src="../narrative-condition-boundary.js"></script><script src="../evaluation-registry-bootstrap.js"></script><script src="../decision-flow.js"></script>
  <script src="../day-completion-flow.js"></script><script src="../relationship-flow.js"></script><script src="../coach-response-flow.js"></script>
  <script src="../narrative-condition-flow.js"></script><script src="../competition-presentation.js"></script><script src="../baseball-gameplay-prototype-utils.js"></script>
  <script src="../baseball-defense-prototype.js"></script><script src="../baseball-offense-prototype.js"></script>
  <script src="../offensive-plate-approach.js"></script><script src="../baseball-gameplay-integration.js"></script>
  <script src="../baseball-training-resolver.js"></script><script src="../career-spine-contract.js"></script><script src="../career-transition-runtime-resolver.js"></script>
  <script src="../career-transition-progression.js"></script><script src="../career-development-runtime-resolver.js"></script><script src="../career-development-progression.js"></script>
  <script src="../career-age22-outcome-resolver.js"></script><script src="../career-save-admission.js"></script><script src="../story.js"></script><script src="../save.js"></script>
  <script src="../script.js?v=221"></script>
  <script>
    let fixtureMatch = null;
    let fixtureNote = "";
    let fixtureAudit = {};

    function startIntegrityFixture(seed = 22101) {
      stopHighSchoolMatchPlayback();
      pendingYouthSeasonOutcome = null;
      isTransitioning = false;
      player = createInitialPlayer("狀態守恆驗收球員");
      applyDebugBookmarkCharacterProfile(player);
      settleHighSchoolEntryCapability(player, { originType: "browser-test-fixture" });
      applyCanonicalPositionProfile(player, "內野手", ["外野手"]);
      player.chapter = "青棒";
      player.highSchoolStep = 5;
      player.highSchoolRoleCode = "starter";
      player.highSchoolTeamRole = "starter";
      pendingHighSchoolMatchSimulationSeed = seed;
      fixtureMatch = prepareHighSchoolYearOneMatch();
      fixtureMatch.presentedEventCursor = fixtureMatch.simulationLog.length;
      fixtureAudit = {};
      return fixtureMatch;
    }

    function prepareEmptyBaseInfieldFixture() {
      const match = startIntegrityFixture();
      Object.assign(match, {
        inning: 3, half: "上", offenseTeam: "away", defenseTeam: "home", outs: 0,
        runners: [null, null, null], currentDomain: "defense", momentIndex: 1,
        currentMomentId: highSchoolYearOneMomentIds[1], simulationPhase: "moment_2_ready",
        currentFieldingPosition: "一壘手", positionDecisionFamily: "", defensiveSituation: {}
      });
      match.battingOrderIndex.away = 3;
      match.currentBatter = match.rosters.away.lineup[3].id;
      match.scoreboardRevealHalfIndex = getHighSchoolHalfInningIndex(match.inning, match.half);
      setHighSchoolDefensiveBallContext(match, "hardGrounder");
      buildInfieldMeaningfulMoment(match, player, {
        playerPosition: "一壘手", ballDirection: "straightAtPlayer",
        playerCapabilities: { fielding: 1, reaction: 1, range: 1, arm: 3, throwing: 3, decision: 3 }
      });
      match.currentAssignment = getHighSchoolDefensiveSituationText(match);
      setHighSchoolCoachTacticalDirection(match);
      recordHighSchoolMatchSimulationEvent(match, {
        type: "meaningfulMomentReached", inning: match.inning, half: match.half,
        momentId: match.currentMomentId, domain: "defense", assignment: match.currentAssignment,
        outs: match.outs, scores: match.scores, runners: match.runners
      });
      advanceHighSchoolPresentationCursor(match);
      return match;
    }

    function recordFixturePlateAppearance(result, runners) {
      const match = startIntegrityFixture();
      match.runners = runners.slice();
      const batter = getHighSchoolMatchLineupBatter(match, "away");
      const before = { outs: match.outs, scores: { ...match.scores }, runners: match.runners.slice() };
      const facts = applyHighSchoolSimulatedPlateAppearance(match, result, batter.id, "away");
      const runsBattedIn = match.scores.away - before.scores.away;
      recordHighSchoolMatchSimulationEvent(match, {
        type: "plateAppearance", inning: match.inning, half: match.half, offenseTeam: "away",
        batterId: batter.id, result, runsBattedIn, runnerChanges: facts.runnerChanges,
        scoringRunnerIds: facts.scoringRunnerIds, before,
        after: { outs: match.outs, scores: { ...match.scores }, runners: match.runners.slice() }
      });
      match.presentedEventCursor = match.simulationLog.length;
      return match;
    }

    function showThirdOutFixture() {
      const match = startIntegrityFixture();
      match.outs = 2;
      const paBefore = match.simulationLog.filter(event => event.type === "plateAppearance").length;
      resolveSimulatedHighSchoolPlateAppearance(match, () => 0);
      advanceHighSchoolPresentationCursor(match);
      const third = getHighSchoolMatchPresentation(match).currentSituation;
      const rejected = resolveSimulatedHighSchoolPlateAppearance(match, () => 0) === false;
      const halfResult = advanceHighSchoolMatchPlaybackStep(match);
      const half = getHighSchoolMatchPresentation(match).currentSituation;
      const sideResult = advanceHighSchoolMatchPlaybackStep(match);
      const side = getHighSchoolMatchPresentation(match).currentSituation;
      const paAfter = match.simulationLog.filter(event => event.type === "plateAppearance" && event.inning === 1 && event.half === "上").length;
      fixtureAudit = { third, half, side, rejected, halfResult, sideResult, noFourthBatter: paAfter === paBefore + 1 };
      fixtureNote = `第三出局 ${third.outs} OUT → 半局結束 ${half.outs} OUT → ${side.inning}局${side.half} ${side.outs} OUT；第四棒：${fixtureAudit.noFourthBatter ? "未發生" : "錯誤"}`;
      renderIntegrityFixture();
    }

    function showEmptyBaseDecisionFixture() {
      const match = prepareEmptyBaseInfieldFixture();
      const observation = getHighSchoolDefensiveObservation(match);
      const choices = getHighSchoolDefensiveMomentChoices(match);
      fixtureAudit = { observation, choices, coach: formatHighSchoolCoachTacticalDirection(deriveHighSchoolCoachTacticalDirection(match), match) };
      fixtureNote = "空壘、一壘手、強襲球：資訊只讀打者、球況與接傳窗口。";
      renderIntegrityFixture();
    }

    function showEmptyBaseErrorFixture() {
      const match = prepareEmptyBaseInfieldFixture();
      const resolution = resolveHighSchoolDefensivePlay(match, "secure", 0);
      applyInfieldResolutionToHighSchoolMatch(match, "secure", resolution);
      while (advanceHighSchoolPresentationCursor(match)) {
        if (getHighSchoolPresentedEvent(match)?.type === "meaningfulMomentResolved") break;
      }
      fixtureAudit = { resolution, occupied: match.runners.filter(Boolean), outcome: match.previousMomentOutcome };
      fixtureNote = `${match.previousMomentOutcome}｜壘包 identity：${match.runners.map(id => id || "空").join("／")}`;
      renderIntegrityFixture();
    }

    function showSingleCommentaryFixture() {
      const match = recordFixturePlateAppearance("single", [null, null, null]);
      fixtureAudit = { feed: getHighSchoolMatchPresentation(match).feed };
      fixtureNote = "一壘安打播報與一壘燈同步。";
      renderIntegrityFixture();
    }

    function showDoubleScoreFixture() {
      const match = recordFixturePlateAppearance("double", [null, "away-sim-2", null]);
      fixtureAudit = { feed: getHighSchoolMatchPresentation(match).feed, scores: { ...match.scores }, runners: match.runners.slice() };
      fixtureNote = `二壘跑者回本壘得分；比分 ${match.scores.away}：${match.scores.home}，打者停在二壘。`;
      renderIntegrityFixture();
    }

    function showMultiInningFixture() {
      const match = startIntegrityFixture(77881);
      let safety = 0;
      while (!match.completed && !(match.inning >= 4 && match.half === "上") && safety++ < 900) {
        if (isHighSchoolMatchDecisionVisible(match)) {
          const choice = getHighSchoolYearOneMatchMomentChoices(match)[0];
          resolveHighSchoolYearOneMatch(choice.matchDecision, choice.matchMomentId, () => 0.65);
        } else advanceHighSchoolMatchPlaybackStep(match);
      }
      match.presentedEventCursor = match.simulationLog.length;
      match.scoreboardRevealHalfIndex = getHighSchoolHalfInningIndex(match.inning, match.half);
      const commentary = match.simulationLog.filter(event => event.type === "plateAppearance").map(event => formatMatchSimulationEvent(event, match)?.text || "");
      fixtureAudit = { safety, commentary, integrity: getHighSchoolMatchStateIntegrityIssues(match) };
      fixtureNote = `前三局完成；${commentary.filter(text => /一壘安打|二壘安打|三壘安打|全壘打|形成出局|保送/.test(text)).length} 則棒球打席播報，integrity ${fixtureAudit.integrity.length ? "失敗" : "正常"}。`;
      renderIntegrityFixture();
    }

    function renderIntegrityFixture() {
      const model = getHighSchoolMatchPresentation(fixtureMatch);
      const choices = isHighSchoolMatchDecisionVisible(fixtureMatch) ? getHighSchoolYearOneMatchMomentChoices(fixtureMatch) : [];
      document.getElementById("fixtureMeta").innerHTML = `<span data-testid="fixture-note">${escapeHtml(fixtureNote)}</span><span data-testid="integrity">Invariant：${getHighSchoolMatchStateIntegrityIssues(fixtureMatch).length ? "FAIL" : "PASS"}</span><span data-testid="errors">JavaScript errors：${window.fixtureErrors.length}</span>`;
      document.getElementById("fixtureRoot").innerHTML = `<article class="event-card high-school-match-card match-mode">
        ${renderHighSchoolYearOneScore("header", model)}
        <div class="match-mode-lower-grid"><div class="match-mode-context-column">${renderHighSchoolLiveSituation(model)}${renderHighSchoolLiveFeed(model)}</div>
        <div class="match-mode-decision-column"><section class="match-current-assignment"><small>目前任務</small><strong>${escapeHtml(model.currentSituation.assignment || "觀察狀態守恆")}</strong></section>
        ${choices.length ? renderHighSchoolOpponentInformation(model) : ""}${renderHighSchoolCoachDirection(model)}
        ${choices.length ? `<section class="match-player-decisions"><small>合法選項</small><div class="match-decision-buttons">${choices.map(choice => `<button type="button">${escapeHtml(choice.text)}</button>`).join("")}</div></section>` : ""}</div></div>
      </article>`;
    }

    showThirdOutFixture();
  </script>
</body>
</html>
