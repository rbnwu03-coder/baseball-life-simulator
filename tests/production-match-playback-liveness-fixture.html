  <script>
    window.fixtureErrors = [];
    window.fixtureAudit = {};
    window.addEventListener("error", event => window.fixtureErrors.push(event.message || "error"));
    window.addEventListener("unhandledrejection", event => window.fixtureErrors.push(String(event.reason || "rejection")));
    const fixtureUsesVirtualClock = new URLSearchParams(location.search).get("clock") === "virtual";
    const fixtureTimers = new Map();
    let fixtureTimerId = 1;
    if (fixtureUsesVirtualClock) {
      window.setTimeout = (callback, delay) => {
        const id = fixtureTimerId++;
        fixtureTimers.set(id, { callback, delay });
        return id;
      };
      window.clearTimeout = id => fixtureTimers.delete(id);
    }
  </script>

  <script src="../script.js?v=2242423"></script>
  <script>
    function getProductionFixtureSnapshot(match = player.highSchoolMatch) {
      const debug = getHighSchoolMatchPlaybackDebugState(match);
      return {
        inning: match?.inning || 0,
        half: match?.half || "",
        outs: match?.outs || 0,
        score: match?.scores ? { ...match.scores } : {},
        runners: Array.isArray(match?.runners) ? match.runners.slice() : [],
        offenseTeam: match?.offenseTeam || "",
        defenseTeam: match?.defenseTeam || "",
        currentBatter: match?.currentBatter || "",
        battingOrderIndex: match?.battingOrderIndex ? { ...match.battingOrderIndex } : {},
        cursor: debug.cursor,
        logLength: debug.logLength,
        phase: debug.phase,
        decisionActive: debug.decisionActive,
        blockingOutcome: debug.blockingOutcome,
        completed: debug.completed,
        timerScheduled: debug.timerScheduled,
        playerLineupStatus: match?.playerLineupStatus || "",
        playerEntryCompleted: match?.playerEntryCompleted === true,
        currentEventId: getCurrentEventId(),
        currentDomain: match?.currentDomain || "",
        momentIndex: match?.momentIndex ?? -1,
        currentMomentId: match?.currentMomentId || "",
        shouldReachDefense: typeof shouldReachHighSchoolDefensiveMoment === "function" ? shouldReachHighSchoolDefensiveMoment(match) : false,
        defensiveDebug: match?.defensiveSituation?.familyId === "infield" ? (() => {
          const choices = getHighSchoolDefensiveMomentChoices(match);
          const classification = classifyPositionFamilyPlay(match.defensiveSituation, choices, true);
          return {
            playerPosition: match.defensiveSituation.playerPosition,
            batterId: match.defensiveSituation.batterId,
            eventClassification: classification.eventClassification,
            decisionTension: classification.decisionTension,
            choices: choices.map(choice => ({ matchDecision: choice.matchDecision || "", routeId: choice.routeId || "", objective: choice.objective || "" }))
          };
        })() : null,
        integrityIssues: typeof getHighSchoolMatchStateIntegrityIssues === "function" ? [...getHighSchoolMatchStateIntegrityIssues(match)] : [],
        lastEvents: Array.isArray(match?.simulationLog) ? match.simulationLog.slice(-6).map(event => ({
          sequence: event.sequence, type: event.type, importance: event.presentationImportance || "",
          inning: event.inning, half: event.half, batterId: event.batterId || "", outs: event.outs ?? event.after?.outs ?? -1
        })) : []
      };
    }

    function hasFixtureForwardProgress(before, after) {
      return before.cursor !== after.cursor
        || before.logLength !== after.logLength
        || before.phase !== after.phase
        || before.decisionActive !== after.decisionActive
        || before.blockingOutcome !== after.blockingOutcome
        || before.completed !== after.completed
        || before.inning !== after.inning
        || before.half !== after.half
        || before.outs !== after.outs
        || JSON.stringify(before.score) !== JSON.stringify(after.score);
    }

    function runFixtureTimer() {
      const next = fixtureTimers.entries().next().value;
      if (!next) return { fired: false, delay: 0 };
      const [id, timer] = next;
      fixtureTimers.delete(id);
      timer.callback();
      return { fired: true, delay: timer.delay };
    }

    function startProductionDirectMatch(seed) {
      stopHighSchoolMatchPlayback();
      if (fixtureUsesVirtualClock) fixtureTimers.clear();
      pendingYouthSeasonOutcome = null;
      isTransitioning = false;
      resetGame();
      setHighSchoolMatchPlaybackDebugEnabled(true);
      clearHighSchoolMatchPlaybackTrace();
      document.getElementById("nameInput").value = "Production Playback 驗收球員";
      selectOrigin(PlayerIdentityOptions.origins[1]);
      selectIdealSelf("棒球理解型");
      generateGenesisProfile(() => 0.25);
      adjustGenesisAbility("ballSense", 1);
      adjustGenesisAbility("observe", 1);
      adjustGenesisAbility("baseballIQ", 1);
      selectDevelopmentEntry("highSchoolFullMatch");
      selectDevelopmentTestPosition("二壘手");
      pendingHighSchoolMatchSimulationSeed = seed;
      createPlayer();
      return player.highSchoolMatch;
    }

    function chooseProductionDecision(sample = .82) {
      const choice = getHighSchoolYearOneMatchMomentChoices(player.highSchoolMatch)[0];
      return Boolean(choice) && chooseHighSchoolYearOneMatchMoment(choice.matchDecision, choice.matchMomentId, () => sample);
    }

    function publishFixture(id, report, pass) {
      report.errors = window.fixtureErrors.slice();
      window.fixtureAudit[id] = report;
      const success = pass && report.errors.length === 0;
      const status = document.getElementById("fixtureStatus");
      status.textContent = `${id}｜${success ? "PASS" : "FAIL"}`;
      status.className = `fixture-status ${success ? "pass" : "fail"}`;
      status.dataset.testid = `status-${id}`;
      document.getElementById("fixtureReport").textContent = JSON.stringify(report, null, 2);
      return success;
    }

    function runProductionPathCase(label, seed) {
      if (!fixtureUsesVirtualClock) return publishFixture(`Production ${label}`, { error: "請以 ?clock=virtual 執行 deterministic case" }, false);
      const match = startProductionDirectMatch(seed);
      const report = {
        label, seed, role: match.role, initialLineupStatus: match.playerLineupStatus,
        beats: 0, decisions: 0, outcomes: 0, continues: 0, noProgress: 0, orphan: 0,
        entrySnapshot: null, lateSnapshots: [], timerDelays: [], final: null
      };
      while (!match.completed && report.beats < 5000) {
        const before = getProductionFixtureSnapshot(match);
        if (before.blockingOutcome) {
          continueYouthSeasonOutcome();
          report.outcomes += 1;
          report.continues += 1;
        } else if (before.decisionActive) {
          report.decisions += 1;
          if (!chooseProductionDecision()) { report.orphan += 1; break; }
        } else {
          const fired = runFixtureTimer();
          if (!fired.fired) { report.orphan += 1; break; }
          if (report.timerDelays.length < 120) report.timerDelays.push(fired.delay);
          const after = getProductionFixtureSnapshot(match);
          if (!hasFixtureForwardProgress(before, after)) {
            report.noProgress += 1;
            report.firstNoProgress = report.firstNoProgress || { before, after };
            if (report.noProgress >= 3) break;
          }
        }
        report.beats += 1;
        const current = getProductionFixtureSnapshot(match);
        if (!report.entrySnapshot && current.playerEntryCompleted) report.entrySnapshot = current;
        if (current.inning >= 6 && report.lateSnapshots.length < 12) report.lateSnapshots.push(current);
      }
      report.final = getProductionFixtureSnapshot(match);
      report.timerCount = fixtureTimers.size;
      const trace = getHighSchoolMatchPlaybackTrace();
      report.traceActions = Array.from(new Set(trace.map(entry => entry.action)));
      report.traceTail = trace.slice(-24);
      const validDelays = report.timerDelays.every(delay => [MATCH_FLOW_BEAT_MS, MATCH_ATTENTION_BEAT_MS, MATCH_MAJOR_TRANSITION_MS].includes(delay));
      const requiredTraceActions = ["schedule-request", "schedule-created", "callback-fired", "step-start", "step-end", "decision-enter", "decision-exit", "outcome-enter", "outcome-exit", "resume-request", "render"];
      const pass = ["bench", "rotation"].includes(report.role) && report.initialLineupStatus === "bench"
        && Boolean(report.entrySnapshot) && report.final.completed && report.orphan === 0 && report.noProgress === 0
        && report.decisions >= 3 && report.outcomes >= 3 && report.timerCount === 0 && validDelays
        && requiredTraceActions.every(action => report.traceActions.includes(action));
      return publishFixture(`Production ${label}`, report, pass);
    }

    function startRealTimerSmoke(seed) {
      if (fixtureUsesVirtualClock) return publishFixture("Real Timer Smoke", { error: "請移除 ?clock=virtual 執行 real timer case" }, false);
      const match = startProductionDirectMatch(seed);
      const initial = getProductionFixtureSnapshot(match);
      const report = { seed, role: match.role, startedAt: Date.now(), observations: 0, samples: [initial], decisions: 0, outcomes: 0 };
      window.fixtureRealSmoke = report;
      const observer = window.setInterval(() => {
        const state = getProductionFixtureSnapshot(match);
        report.observations += 1;
        const progressKey = sample => JSON.stringify([sample.cursor, sample.logLength, sample.phase, sample.decisionActive, sample.blockingOutcome, sample.completed]);
        if (progressKey(state) !== progressKey(report.samples.at(-1))) report.samples.push(state);
        if (state.blockingOutcome) { continueYouthSeasonOutcome(); report.outcomes += 1; }
        else if (state.decisionActive) { chooseProductionDecision(); report.decisions += 1; }
        const automaticBeats = Math.max(0, report.samples.length - 1);
        document.getElementById("fixtureReport").textContent = JSON.stringify({ ...report, automaticBeats }, null, 2);
        if (match.completed || automaticBeats >= 22 || report.observations >= 220) {
          window.clearInterval(observer);
          const trace = getHighSchoolMatchPlaybackTrace();
          const observedDelays = Array.from(new Set(trace.filter(entry => entry.action === "schedule-created").map(entry => Number(entry.result)).filter(Number.isFinite)));
          const final = getProductionFixtureSnapshot(match);
          const transition = report.samples.some(sample => sample.inning !== initial.inning || sample.half !== initial.half);
          const pass = automaticBeats >= 20 && transition && (final.timerScheduled || final.completed) && window.fixtureErrors.length === 0
            && [MATCH_FLOW_BEAT_MS, MATCH_ATTENTION_BEAT_MS, MATCH_MAJOR_TRANSITION_MS].every(delay => observedDelays.includes(delay));
          publishFixture("Real Timer Smoke", { ...report, automaticBeats, transition, observedDelays, final }, pass);
        }
      }, 250);
      return report;
    }
  </script>
