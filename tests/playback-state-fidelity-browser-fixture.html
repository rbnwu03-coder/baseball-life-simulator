<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Playback State Fidelity Browser Validation</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    body { margin: 0; padding: 24px; background: #f4f0e6; }
    .fixture-toolbar { max-width: 1180px; margin: 0 auto 18px; padding: 18px; border-radius: 16px; background: #fff; box-shadow: 0 8px 30px #1d2d2530; }
    .fixture-toolbar h1 { margin: 0 0 8px; font-size: 1.3rem; }
    .fixture-toolbar p { margin: 0 0 12px; color: #536157; }
    .fixture-buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .fixture-buttons button { width: auto; margin: 0; padding: 9px 13px; border: 1px solid #8b9a90; border-radius: 999px; background: #fff; color: #243a30; }
    .fixture-buttons button[aria-pressed="true"] { background: #234c3a; border-color: #234c3a; color: #fff; }
    .fixture-meta { max-width: 1180px; margin: 0 auto 14px; padding: 10px 14px; border-left: 4px solid #9c5b32; background: #fff8ea; }
    .fixture-meta strong { margin-right: 8px; }
    #fixtureRoot { max-width: 1180px; margin: 0 auto; }
  </style>
</head>
<body>
  <header class="fixture-toolbar">
    <h1>Baseball Match Foundation 2.1.1｜Playback State Fidelity</h1>
    <p>使用正式 match event、presentation snapshot、單一游標與 Infield Decision Family；此頁只提供決定性驗收控制。</p>
    <div class="fixture-buttons" role="group" aria-label="播放驗收情境">
      <button type="button" data-mode="bases" onclick="setupPlaybackFixture('bases')">A｜壘況推進</button>
      <button type="button" data-mode="outs" onclick="setupPlaybackFixture('outs')">B｜0→3 OUT→換局</button>
      <button type="button" data-mode="score" onclick="setupPlaybackFixture('score')">C｜得分同步</button>
      <button type="button" data-mode="decision" onclick="setupPlaybackFixture('decision')">D｜決策暫停</button>
      <button type="button" data-mode="queue" onclick="setupPlaybackFixture('queue')">E｜Meaningful Queue</button>
    </div>
    <div class="fixture-buttons" role="group" aria-label="指定本場守位">
      <button type="button" data-position="一壘手" onclick="showPositionFixture('一壘手')">F｜一壘手</button>
      <button type="button" data-position="二壘手" onclick="showPositionFixture('二壘手')">G｜二壘手</button>
      <button type="button" data-position="游擊手" onclick="showPositionFixture('游擊手')">H｜游擊手</button>
      <button type="button" data-position="三壘手" onclick="showPositionFixture('三壘手')">I｜三壘手</button>
    </div>
    <div class="fixture-buttons">
      <button id="nextBeat" type="button" onclick="advanceFixtureBeat()">下一個呈現節點</button>
    </div>
  </header>
  <p class="fixture-meta" id="fixtureMeta" aria-live="polite"></p>
  <main id="fixtureRoot"></main>
  <div id="story" hidden></div><div id="choices" hidden></div><div id="changeLog" hidden></div><div id="status" hidden></div><div id="time" hidden></div><div id="player-info" hidden></div>

  <script>
    window.fixtureErrors = [];
    window.addEventListener("error", event => window.fixtureErrors.push(event.message || "error"));
    window.addEventListener("unhandledrejection", event => window.fixtureErrors.push(String(event.reason || "rejection")));
  </script>
  <script src="../player.js"></script><script src="../current-state-boundary.js"></script><script src="../time-boundary.js"></script>
  <script src="../relationship-boundary.js"></script><script src="../evaluation-registry.js"></script><script src="../coach-evaluation-boundary.js"></script>
  <script src="../narrative-condition-boundary.js"></script><script src="../evaluation-registry-bootstrap.js"></script><script src="../decision-flow.js"></script>
  <script src="../day-completion-flow.js"></script><script src="../relationship-flow.js"></script><script src="../coach-response-flow.js"></script>
  <script src="../narrative-condition-flow.js"></script><script src="../competition-presentation.js"></script><script src="../baseball-gameplay-prototype-utils.js"></script>
  <script src="../baseball-defense-prototype.js"></script><script src="../baseball-offense-prototype.js"></script>
  <script src="../offensive-plate-approach.js"></script><script src="../baseball-gameplay-integration.js"></script>
  <script src="../baseball-training-resolver.js"></script><script src="../career-spine-contract.js"></script><script src="../career-transition-runtime-resolver.js"></script>
  <script src="../career-transition-progression.js"></script><script src="../career-development-runtime-resolver.js"></script><script src="../career-development-progression.js"></script>
  <script src="../career-age22-outcome-resolver.js"></script><script src="../career-save-admission.js"></script><script src="../story.js"></script><script src="../save.js"></script>
  <script src="../script.js?v=211"></script>
  <script>
    let fixtureMatch = null;
    let fixtureMode = "";

    function createPlaybackFixtureMatch(positionOverride = "") {
      pendingHighSchoolMatchPositionOverride = positionOverride;
      player = createInitialPlayer("瀏覽器驗收球員");
      applyDebugBookmarkCharacterProfile(player);
      settleHighSchoolEntryCapability(player, { originType: "browser-test-fixture" });
      applyCanonicalPositionProfile(player, "內野手", ["外野手"]);
      player.chapter = "青棒";
      player.highSchoolStep = 5;
      player.highSchoolRoleCode = "starter";
      player.highSchoolTeamRole = "先發／關鍵任務";
      Object.keys(player.baseballSkills).forEach(key => { player.baseballSkills[key] = 7; });
      Object.assign(player, { ballSense: 7, observe: 7, fitness: 7, instinct: 7, discipline: 7, responsibility: 7 });
      const match = prepareHighSchoolYearOneMatch();
      Object.assign(match, { inning: 5, half: "上", offenseTeam: "away", defenseTeam: "home", outs: 0, runners: [null, null, null], scores: { home: 1, away: 1 }, simulationPhase: "moment_1_resolved" });
      match.scoreboardRevealHalfIndex = getHighSchoolHalfInningIndex(5, "上");
      ensureHighSchoolMatchLineScoreInning(match, "away", 5);
      recordHighSchoolMatchSimulationEvent(match, { type: "fixtureStart", presentationImportance: "hidden", inning: 5, half: "上", outs: 0, scores: match.scores, runners: match.runners });
      match.presentedEventCursor = match.simulationLog.length;
      return match;
    }

    function recordFixturePlateAppearance(match, result) {
      const batter = getHighSchoolMatchLineupBatter(match, match.offenseTeam);
      const before = { outs: match.outs, scores: { ...match.scores }, runners: match.runners.slice() };
      applyHighSchoolSimulatedPlateAppearance(match, result, batter.id, match.offenseTeam);
      recordHighSchoolMatchSimulationEvent(match, { type: "plateAppearance", inning: match.inning, half: match.half, offenseTeam: match.offenseTeam, batterId: batter.id, result, before, after: { outs: match.outs, scores: { ...match.scores }, runners: match.runners.slice() } });
      advanceHighSchoolMatchBattingOrder(match, match.offenseTeam);
    }

    function setupPlaybackFixture(mode) {
      fixtureMode = mode;
      fixtureMatch = createPlaybackFixtureMatch();
      const startCursor = fixtureMatch.presentedEventCursor;
      if (mode === "bases") {
        recordFixturePlateAppearance(fixtureMatch, "walk");
        recordFixturePlateAppearance(fixtureMatch, "single");
        recordFixturePlateAppearance(fixtureMatch, "double");
      } else if (mode === "outs") {
        recordFixturePlateAppearance(fixtureMatch, "out");
        recordFixturePlateAppearance(fixtureMatch, "out");
        recordFixturePlateAppearance(fixtureMatch, "out");
        endHighSchoolMatchHalfInning(fixtureMatch);
      } else if (mode === "score") {
        fixtureMatch.runners = ["away-sim-5", "away-sim-6", "away-sim-7"];
        recordHighSchoolMatchSimulationEvent(fixtureMatch, { type: "fixtureStart", presentationImportance: "hidden", inning: 5, half: "上", outs: 0, scores: fixtureMatch.scores, runners: fixtureMatch.runners });
        fixtureMatch.presentedEventCursor = fixtureMatch.simulationLog.length;
        recordFixturePlateAppearance(fixtureMatch, "walk");
      } else if (mode === "decision") {
        fixtureMatch = createPlaybackFixtureMatch("游擊手");
        Object.assign(fixtureMatch, { outs: 1, runners: ["away-sim-2", "away-sim-3", null] });
        prepareHighSchoolDefensiveMomentFromSimulation(fixtureMatch);
        advanceHighSchoolPresentationCursor(fixtureMatch);
      } else if (mode === "queue") {
        fixtureMatch = createPlaybackFixtureMatch("游擊手");
        const queueStart = fixtureMatch.presentedEventCursor;
        recordFixturePlateAppearance(fixtureMatch, "walk");
        recordFixturePlateAppearance(fixtureMatch, "single");
        recordFixturePlateAppearance(fixtureMatch, "out");
        prepareHighSchoolDefensiveMomentFromSimulation(fixtureMatch);
        fixtureMatch.presentedEventCursor = queueStart;
      }
      if (mode !== "score" && mode !== "decision" && mode !== "queue") fixtureMatch.presentedEventCursor = startCursor;
      document.querySelectorAll("[data-mode]").forEach(button => button.setAttribute("aria-pressed", String(button.dataset.mode === mode)));
      document.querySelectorAll("[data-position]").forEach(button => button.setAttribute("aria-pressed", "false"));
      renderPlaybackFixture();
    }

    function advanceFixtureBeat() {
      if (!fixtureMatch) return;
      const before = fixtureMatch.presentedEventCursor;
      const result = advanceHighSchoolMatchPlaybackStep(fixtureMatch);
      const event = getHighSchoolPresentedEvent(fixtureMatch);
      renderPlaybackFixture(result ? `${event?.type || result}｜cursor ${before}→${fixtureMatch.presentedEventCursor}` : `決策暫停｜cursor 維持 ${before}`);
    }

    function showPositionFixture(position) {
      fixtureMode = "position";
      fixtureMatch = createPlaybackFixtureMatch(position);
      Object.assign(fixtureMatch, { outs: 1, runners: ["away-sim-2", "away-sim-3", null] });
      prepareHighSchoolDefensiveMomentFromSimulation(fixtureMatch);
      advanceHighSchoolPresentationCursor(fixtureMatch);
      document.querySelectorAll("[data-mode]").forEach(button => button.setAttribute("aria-pressed", "false"));
      document.querySelectorAll("[data-position]").forEach(button => button.setAttribute("aria-pressed", String(button.dataset.position === position)));
      renderPlaybackFixture(`本場 ${position}｜生涯主守位仍為 ${player.primaryPosition}`);
    }

    function renderPlaybackFixture(note = "等待下一個呈現節點") {
      const model = getHighSchoolMatchPresentation(fixtureMatch);
      const currentEvent = getHighSchoolPresentedEvent(fixtureMatch);
      const choices = isHighSchoolMatchDecisionVisible(fixtureMatch) ? getHighSchoolDefensiveMomentChoices(fixtureMatch) : [];
      document.getElementById("fixtureMeta").innerHTML = `<strong data-testid="beat-note">${escapeHtml(note)}</strong><span data-testid="event-type">目前事件：${escapeHtml(currentEvent?.type || "起始狀態")}</span>｜<span data-testid="cursor">${fixtureMatch.presentedEventCursor}/${fixtureMatch.simulationLog.length}</span>｜<span data-testid="canonical-position">Canonical：${escapeHtml(player.primaryPosition)}</span>｜<span data-testid="error-count">JavaScript errors：${window.fixtureErrors.length}</span>`;
      document.getElementById("fixtureRoot").innerHTML = `<article class="event-card high-school-match-card match-mode">
        ${renderHighSchoolYearOneScore("header", model)}
        <div class="match-mode-lower-grid"><div class="match-mode-context-column">${renderHighSchoolLiveSituation(model)}${renderHighSchoolLiveFeed(model)}</div>
        <div class="match-mode-decision-column"><section class="match-current-assignment"><small>目前任務</small><strong>${escapeHtml(model.currentSituation.assignment || "觀察比賽推進")}</strong></section>
        ${choices.length ? renderHighSchoolOpponentInformation(model) + renderHighSchoolCoachDirection(model) + `<section class="match-player-decisions"><small>合法選擇</small><div class="match-decision-buttons">${choices.map(choice => `<button type="button" onclick="resolveFixtureDecision('${choice.matchDecision}')">${escapeHtml(choice.text)}</button>`).join("")}</div></section>` : ""}</div></div>
      </article>`;
    }

    function resolveFixtureDecision(decision) {
      if (!fixtureMatch || !isHighSchoolMatchDecisionVisible(fixtureMatch)) return false;
      const narrative = resolveHighSchoolYearOneMatch(decision, fixtureMatch.currentMomentId, () => 0.8);
      const event = advanceHighSchoolPresentationCursor(fixtureMatch);
      renderPlaybackFixture(`${event?.type || "outcome"}｜${narrative ? "決策結果已呈現，可繼續播放" : "決策未成立"}`);
      return Boolean(narrative);
    }

    setupPlaybackFixture("bases");
  </script>
</body>
</html>
