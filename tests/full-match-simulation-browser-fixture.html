<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Full Match Simulation Browser Validation</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    body { margin: 0; padding: 24px; background: #f4f0e6; }
    .fixture-toolbar { max-width: 1180px; margin: 0 auto 18px; padding: 18px; border-radius: 16px; background: #fff; box-shadow: 0 8px 30px #1d2d2530; }
    .fixture-toolbar h1 { margin: 0 0 8px; font-size: 1.3rem; }
    .fixture-toolbar p { margin: 0 0 12px; color: #536157; }
    .fixture-buttons { display: flex; flex-wrap: wrap; gap: 8px; }
    .fixture-buttons button { width: auto; margin: 0; padding: 9px 13px; border: 1px solid #8b9a90; border-radius: 999px; background: #fff; color: #243a30; }
    .fixture-meta { max-width: 1180px; margin: 0 auto 14px; padding: 10px 14px; border-left: 4px solid #9c5b32; background: #fff8ea; }
    .fixture-meta span { margin-right: 12px; }
    #fixtureRoot { max-width: 1180px; margin: 0 auto; }
  </style>
</head>
<body>
  <header class="fixture-toolbar">
    <h1>Baseball Match Foundation 2.2｜Full Match Simulation</h1>
    <p>所有控制都呼叫正式 simulator、meaningful interception 與 presentation cursor；按鈕只縮短瀏覽器驗收時間。</p>
    <div class="fixture-buttons" role="group" aria-label="完整比賽驗收控制">
      <button type="button" onclick="startFullMatchFixture('starter',22001)">A｜先發開場</button>
      <button type="button" onclick="startFullMatchFixture('bench',22001)">B｜板凳開場</button>
      <button type="button" onclick="advanceFullMatchFixtureBeat()">下一個節點</button>
      <button type="button" onclick="advanceFullMatchFixtureToDecision()">推進至決策</button>
      <button type="button" onclick="resolveFullMatchFixtureDecision()">執行目前決策</button>
      <button type="button" onclick="finishFullMatchFixture()">完成七局／延長賽</button>
      <button type="button" onclick="compareFullMatchFixtureReplay()">重播差異</button>
    </div>
  </header>
  <p class="fixture-meta" id="fixtureMeta" aria-live="polite"></p>
  <main id="fixtureRoot"></main>
  <div id="story" hidden></div><div id="choices" hidden></div><div id="changeLog" hidden></div><div id="status" hidden></div><div id="time" hidden></div><div id="player-info" hidden></div>

  <script>
    window.fixtureErrors = [];
    window.addEventListener("error", event => window.fixtureErrors.push(event.message || "error"));
    window.addEventListener("unhandledrejection", event => window.fixtureErrors.push(String(event.reason || "rejection")));
  </script>
  <script src="../player.js"></script><script src="../current-state-boundary.js"></script><script src="../time-boundary.js"></script>
  <script src="../relationship-boundary.js"></script><script src="../evaluation-registry.js"></script><script src="../coach-evaluation-boundary.js"></script>
  <script src="../narrative-condition-boundary.js"></script><script src="../evaluation-registry-bootstrap.js"></script><script src="../decision-flow.js"></script>
  <script src="../day-completion-flow.js"></script><script src="../relationship-flow.js"></script><script src="../coach-response-flow.js"></script>
  <script src="../narrative-condition-flow.js"></script><script src="../competition-presentation.js"></script><script src="../baseball-gameplay-prototype-utils.js"></script>
  <script src="../baseball-defense-prototype.js"></script><script src="../baseball-offense-prototype.js"></script><script src="../baseball-gameplay-integration.js"></script>
  <script src="../baseball-training-resolver.js"></script><script src="../career-spine-contract.js"></script><script src="../career-transition-runtime-resolver.js"></script>
  <script src="../career-transition-progression.js"></script><script src="../career-development-runtime-resolver.js"></script><script src="../career-development-progression.js"></script>
  <script src="../career-age22-outcome-resolver.js"></script><script src="../career-save-admission.js"></script><script src="../story.js"></script><script src="../save.js"></script>
  <script src="../script.js?v=22"></script>
  <script>
    let fixtureMatch = null;
    let fixtureNote = "";

    function startFullMatchFixture(role = "starter", seed = 22001) {
      stopHighSchoolMatchPlayback();
      pendingYouthSeasonOutcome = null;
      isTransitioning = false;
      player = createInitialPlayer("完整比賽瀏覽器驗收");
      applyDebugBookmarkCharacterProfile(player);
      settleHighSchoolEntryCapability(player, { originType: "browser-test-fixture" });
      applyCanonicalPositionProfile(player, "內野手", ["外野手"]);
      player.chapter = "青棒";
      player.highSchoolStep = 5;
      player.highSchoolRoleCode = role;
      player.highSchoolTeamRole = role;
      pendingHighSchoolMatchSimulationSeed = seed;
      fixtureMatch = prepareHighSchoolYearOneMatch();
      fixtureNote = `${role === "starter" ? "先發" : "板凳"}正式開場`;
      renderFullMatchFixture();
      return fixtureMatch;
    }

    function advanceFullMatchFixtureBeat() {
      if (!fixtureMatch || fixtureMatch.completed || isHighSchoolMatchDecisionVisible(fixtureMatch)) return false;
      const result = advanceHighSchoolMatchPlaybackStep(fixtureMatch);
      fixtureNote = `單步：${result || "等待"}`;
      renderFullMatchFixture();
      return result;
    }

    function advanceFullMatchFixtureToDecision() {
      if (!fixtureMatch) return false;
      let safety = 0;
      while (!fixtureMatch.completed && !isHighSchoolMatchDecisionVisible(fixtureMatch) && safety++ < 700) {
        advanceHighSchoolMatchPlaybackStep(fixtureMatch);
      }
      fixtureNote = fixtureMatch.completed ? "比賽已結束" : `決策抵達：${fixtureMatch.currentMomentId}`;
      renderFullMatchFixture();
      return isHighSchoolMatchDecisionVisible(fixtureMatch);
    }

    function resolveFullMatchFixtureDecision() {
      if (!fixtureMatch || !isHighSchoolMatchDecisionVisible(fixtureMatch)) return false;
      const choice = getHighSchoolYearOneMatchMomentChoices(fixtureMatch)[0];
      const result = resolveHighSchoolYearOneMatch(choice.matchDecision, choice.matchMomentId, () => 0.62);
      advanceHighSchoolPresentationCursor(fixtureMatch);
      fixtureNote = `決策寫回：${choice.matchDecision}`;
      renderFullMatchFixture();
      return Boolean(result);
    }

    function finishFullMatchFixture() {
      if (!fixtureMatch) return false;
      let safety = 0;
      while (!fixtureMatch.completed && safety++ < 1600) {
        if (isHighSchoolMatchDecisionVisible(fixtureMatch)) {
          const choice = getHighSchoolYearOneMatchMomentChoices(fixtureMatch)[0];
          resolveHighSchoolYearOneMatch(choice.matchDecision, choice.matchMomentId, () => 0.62);
        } else {
          advanceHighSchoolMatchPlaybackStep(fixtureMatch);
        }
      }
      fixtureNote = fixtureMatch.completed ? `終場：${fixtureMatch.teamResult}` : "安全上限前未完成";
      renderFullMatchFixture();
      return fixtureMatch.completed;
    }

    function getFixtureOpeningSequence(seed) {
      startFullMatchFixture("starter", seed);
      let safety = 0;
      while (fixtureMatch.simulationLog.filter(event => event.type === "plateAppearance").length < 12 && safety++ < 500) {
        if (isHighSchoolMatchDecisionVisible(fixtureMatch)) resolveFullMatchFixtureDecision();
        else advanceHighSchoolMatchPlaybackStep(fixtureMatch);
      }
      return fixtureMatch.simulationLog.filter(event => event.type === "plateAppearance").slice(0, 12).map(event => event.result);
    }

    function compareFullMatchFixtureReplay() {
      const first = getFixtureOpeningSequence(1103);
      const second = getFixtureOpeningSequence(880301);
      fixtureNote = `重播差異：${first.join("／")} ≠ ${second.join("／")}`;
      renderFullMatchFixture();
      return first.join() !== second.join();
    }

    function renderFullMatchFixture() {
      const model = getHighSchoolMatchPresentation(fixtureMatch);
      const evidenceCount = Object.keys(fixtureMatch.performanceEvidence || {}).length;
      document.getElementById("fixtureMeta").innerHTML = `<span data-testid="fixture-note">${escapeHtml(fixtureNote)}</span><span data-testid="role">狀態：${escapeHtml(fixtureMatch.playerLineupStatus)}</span><span data-testid="entry">登場：${fixtureMatch.playerEntryCompleted ? "是" : "否"}</span><span data-testid="moments">決策：${fixtureMatch.completedMoments.length}</span><span data-testid="evidence">NPC／玩家證據：${evidenceCount}</span><span data-testid="errors">JavaScript errors：${window.fixtureErrors.length}</span>`;
      const choices = isHighSchoolMatchDecisionVisible(fixtureMatch) ? getHighSchoolYearOneMatchMomentChoices(fixtureMatch) : [];
      document.getElementById("fixtureRoot").innerHTML = `<article class="event-card high-school-match-card match-mode">
        ${renderHighSchoolYearOneScore("header", model)}
        <div class="match-mode-lower-grid"><div class="match-mode-context-column">${renderHighSchoolLiveSituation(model)}${renderHighSchoolLiveFeed(model)}</div>
        <div class="match-mode-decision-column"><section class="match-current-assignment"><small>目前任務</small><strong>${escapeHtml(model.currentSituation.assignment || "觀察完整比賽")}</strong></section>${renderHighSchoolCoachDirection(model)}
        ${choices.length ? `<section class="match-player-decisions"><small>玩家決策已暫停</small><div class="match-decision-buttons">${choices.map(choice => `<button type="button">${escapeHtml(choice.text)}</button>`).join("")}</div></section>` : `<div class="match-playback-status"><strong>${fixtureMatch.completed ? "完整比賽結束" : "比賽持續進行"}</strong></div>`}</div></div>
      </article>`;
    }

    startFullMatchFixture("starter", 22001);
  </script>
</body>
</html>
