<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2.2.4.4 Human / Audit Opportunity Parity</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    body { margin: 0; padding: 24px; background: #f4f0e6; }
    .fixture-toolbar, .fixture-audit, #story, #choices { max-width: 1180px; margin: 0 auto 16px; }
    .fixture-toolbar, .fixture-audit { padding: 18px; border-radius: 16px; background: #fff; box-shadow: 0 8px 30px #1d2d2530; }
    .fixture-toolbar h1 { margin: 0 0 8px; font-size: 1.35rem; }
    .fixture-toolbar p { margin: 0 0 12px; color: #536157; }
    .fixture-buttons { display: flex; flex-wrap: wrap; gap: 8px; }
    .fixture-buttons button { width: auto; margin: 0; padding: 9px 13px; border: 1px solid #8b9a90; border-radius: 999px; background: #fff; color: #243a30; }
    .fixture-status { display: inline-block; margin-bottom: 8px; padding: 3px 9px; border-radius: 999px; font-weight: 800; }
    .fixture-status.pass { color: #174b2d; background: #dff4e6; }
    .fixture-status.fail { color: #7c231f; background: #f8deda; }
    .fixture-audit pre { margin: 0; max-height: 44rem; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; font: 0.82rem/1.5 ui-monospace, monospace; }
  </style>
</head>
<body>
  <header class="fixture-toolbar">
    <h1>Baseball Match Foundation 2.2.4.4｜Human / Audit Parity</h1>
    <p>透過正式創角與 High School Full Match Direct Start 執行 Browser playback，再以相同 seed、fixture 與 choice policy 做 direct audit replay。</p>
    <div class="fixture-buttons" role="group" aria-label="Parity 驗收案例">
      <button type="button" data-testid="run-parity" onclick="runTwentySeedParity()">Run 20-seed Parity</button>
      <button type="button" data-testid="run-human" onclick="runHumanSeed()">Run Human Seed 22424201</button>
    </div>
  </header>
  <section class="fixture-audit" aria-labelledby="fixtureAuditTitle">
    <h2 id="fixtureAuditTitle">Fixture Debug（不屬於正式玩家 UI）</h2>
    <span id="fixtureStatus" class="fixture-status">尚未執行</span>
    <pre id="fixtureReport" data-testid="fixture-report">請選擇案例。</pre>
  </section>
  <main id="story"></main>
  <div id="choices"></div>
  <div id="changeLog" hidden></div><div id="status" hidden></div><div id="time" hidden></div><div id="player-info" hidden></div>
  <section id="characterCreation" hidden>
    <input id="nameInput" value="2.2.4.4 Parity 球員">
    <div id="characterCreationFeedback"></div><div id="idealSelfDescription"></div>
    <div id="genesisAllocation"></div><div id="genesisShape"></div><div id="genesisBudget"></div>
    <button id="genesisRollButton" type="button"></button><button id="careerStartButton" type="button"></button>
    <select id="batsSelect"><option value="R" selected>右打</option></select>
    <select id="throwsSelect"><option value="R" selected>右投</option></select>
    <div id="developmentEntryDescription"></div><div id="developmentPositionDescription"></div>
  </section>

  <script>
    window.fixtureErrors = [];
    window.fixtureAudit = {};
    window.addEventListener("error", event => window.fixtureErrors.push(event.message || "error"));
    window.addEventListener("unhandledrejection", event => window.fixtureErrors.push(String(event.reason || "rejection")));
    const fixtureTimers = new Map();
    let fixtureTimerId = 1;
    window.setTimeout = (callback, delay) => { const id = fixtureTimerId++; fixtureTimers.set(id, { callback, delay }); return id; };
    window.clearTimeout = id => fixtureTimers.delete(id);
  </script>
  <script src="../player.js"></script><script src="../current-state-boundary.js"></script><script src="../time-boundary.js"></script>
  <script src="../relationship-boundary.js"></script><script src="../evaluation-registry.js"></script><script src="../coach-evaluation-boundary.js"></script>
  <script src="../narrative-condition-boundary.js"></script><script src="../evaluation-registry-bootstrap.js"></script><script src="../decision-flow.js"></script>
  <script src="../day-completion-flow.js"></script><script src="../relationship-flow.js"></script><script src="../coach-response-flow.js"></script>
  <script src="../narrative-condition-flow.js"></script><script src="../competition-presentation.js"></script><script src="../baseball-gameplay-prototype-utils.js"></script>
  <script src="../baseball-defense-prototype.js"></script><script src="../baseball-offense-prototype.js"></script>
  <script src="../offensive-plate-approach.js"></script><script src="../baseball-gameplay-integration.js"></script>
  <script src="../baseball-training-resolver.js"></script><script src="../career-spine-contract.js"></script><script src="../career-transition-runtime-resolver.js"></script>
  <script src="../career-transition-progression.js"></script><script src="../career-development-runtime-resolver.js"></script><script src="../career-development-progression.js"></script>
  <script src="../career-age22-outcome-resolver.js"></script><script src="../career-save-admission.js"></script><script src="../story.js"></script><script src="../save.js"></script>
  <script src="../script.js?v=2242441"></script>
  <script>
    function runFixtureTimer() {
      const next = fixtureTimers.entries().next().value;
      if (!next) return false;
      const [id, timer] = next;
      fixtureTimers.delete(id);
      timer.callback();
      return true;
    }

    function startProductionMatch(seed) {
      stopHighSchoolMatchPlayback("2.2.4.4-fixture-reset");
      fixtureTimers.clear();
      pendingYouthSeasonOutcome = null;
      isTransitioning = false;
      resetGame();
      setHighSchoolMatchOpportunityDebugEnabled(true);
      document.getElementById("nameInput").value = "2.2.4.4 Parity 球員";
      selectOrigin(PlayerIdentityOptions.origins[1]);
      selectIdealSelf("棒球理解型");
      generateGenesisProfile(() => .25);
      adjustGenesisAbility("ballSense", 1);
      adjustGenesisAbility("observe", 1);
      adjustGenesisAbility("baseballIQ", 1);
      selectDevelopmentEntry("highSchoolFullMatch");
      selectDevelopmentTestPosition("二壘手");
      pendingHighSchoolMatchSimulationSeed = seed;
      createPlayer();
      return player.highSchoolMatch;
    }

    function playCompleteMatch(seed, playbackMode) {
      const match = startProductionMatch(seed);
      if (playbackMode === "direct") { stopHighSchoolMatchPlayback("2.2.4.4-direct"); fixtureTimers.clear(); }
      let steps = 0;
      let decisions = 0;
      let orphan = 0;
      while (!match.completed && steps++ < 5000) {
        if (hasBlockingHighSchoolMatchOutcome()) {
          continueYouthSeasonOutcome();
          if (playbackMode === "direct") { stopHighSchoolMatchPlayback("2.2.4.4-direct-outcome"); fixtureTimers.clear(); }
        } else if (isHighSchoolMatchDecisionVisible(match)) {
          showCurrentEvent();
          const choice = getHighSchoolYearOneMatchMomentChoices(match)[0];
          if (!choice || !chooseHighSchoolYearOneMatchMoment(choice.matchDecision, choice.matchMomentId, () => .82)) { orphan += 1; break; }
          decisions += 1;
          if (playbackMode === "direct") { stopHighSchoolMatchPlayback("2.2.4.4-direct-choice"); fixtureTimers.clear(); }
        } else if (playbackMode === "browser") {
          if (!runFixtureTimer()) { orphan += 1; break; }
        } else {
          const progressed = advanceHighSchoolMatchPlaybackStep(match);
          showCurrentEvent();
          stopHighSchoolMatchPlayback("2.2.4.4-direct-step");
          fixtureTimers.clear();
          if (!progressed) { orphan += 1; break; }
        }
      }
      return { seed, playbackMode, steps, decisions, orphan, trace: JSON.parse(exportHighSchoolMatchOpportunityDebug(match)) };
    }

    function publishFixture(id, report, pass) {
      report.errors = window.fixtureErrors.slice();
      window.fixtureAudit[id] = report;
      const success = pass && report.errors.length === 0;
      const status = document.getElementById("fixtureStatus");
      status.textContent = `${id}｜${success ? "PASS" : "FAIL"}`;
      status.className = `fixture-status ${success ? "pass" : "fail"}`;
      document.getElementById("fixtureReport").textContent = JSON.stringify(report, null, 2);
      return success;
    }

    function runTwentySeedParity() {
      const results = [];
      for (let seed = 22424201; seed <= 22424220; seed += 1) {
        const browser = playCompleteMatch(seed, "browser");
        const audit = playCompleteMatch(seed, "direct");
        const comparison = compareHighSchoolMatchOpportunityTraces(browser.trace, audit.trace);
        results.push({ seed, equal: comparison.equal, firstDivergence: comparison.firstDivergence, browserOrphan: browser.orphan, auditOrphan: audit.orphan });
      }
      const report = {
        runtimeSignature: window.BASEBALL_MATCH_BUILD_SIGNATURE,
        repoPath: location.pathname,
        results,
        firstDivergence: results.find(result => !result.equal) || null
      };
      window.fixtureParityReport = report;
      return publishFixture("20-seed parity", report, results.length === 20 && results.every(result => result.equal && result.browserOrphan === 0 && result.auditOrphan === 0));
    }

    function runHumanSeed() {
      const human = playCompleteMatch(22424201, "browser");
      const audit = playCompleteMatch(22424201, "direct");
      const comparison = compareHighSchoolMatchOpportunityTraces(human.trace, audit.trace);
      const debugButton = Array.from(document.querySelectorAll("button")).find(button => button.textContent.trim() === "複製比賽追蹤");
      const report = {
        runtimeSignature: window.BASEBALL_MATCH_BUILD_SIGNATURE,
        comparison,
        summary: human.trace.summary,
        lifecycle: human.trace.lifecycle,
        debugCopyButtonPresent: Boolean(debugButton),
        humanOrphan: human.orphan,
        auditOrphan: audit.orphan
      };
      window.fixtureHumanReport = report;
      return publishFixture("Human seed 22424201", report, comparison.equal && Boolean(debugButton) && human.orphan === 0 && audit.orphan === 0);
    }
  </script>
</body>
</html>
